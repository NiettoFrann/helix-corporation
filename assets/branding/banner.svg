<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="HELIX CORPORATION — ninguna corporación es intocable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#121018"/>
    </linearGradient>
    <radialGradient id="glowR" cx="16%" cy="0%" r="75%">
      <stop offset="0" stop-color="#C1121F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="100%" cy="100%" r="70%">
      <stop offset="0" stop-color="#740EE0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#740EE0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="16" fill="url(#glowR)"/>
  <rect width="1000" height="300" rx="16" fill="url(#glowP)"/>
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#2A2A3A"/>

  <!-- barra de ventana -->
  <line x1="24" y1="54" x2="976" y2="54" stroke="#2A2A3A"/>
  <circle cx="42" cy="31" r="6" fill="#C1121F"/>
  <circle cx="64" cy="31" r="6" fill="#E0A23C"/>
  <circle cx="86" cy="31" r="6" fill="#3DF57E"/>
  <text x="122" y="36" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#8A8A99">helix-corp@10.0.4.12: ~/la-mano-negra</text>

  <!-- emblema doble hélice -->
  <g transform="translate(74 112) scale(2.55)" stroke-linecap="round">
    <path d="M15 8 C 21 16, 21 32, 15 40" fill="none" stroke="#4FC3DC" stroke-width="2.4"/>
    <path d="M33 8 C 27 16, 27 32, 33 40" fill="none" stroke="#4FC3DC" stroke-width="2.4"/>
    <line x1="16.5" y1="14" x2="31.5" y2="14" stroke="#4FC3DC" stroke-width="2" opacity="0.45"/>
    <line x1="18" y1="24" x2="30" y2="24" stroke="#4FC3DC" stroke-width="3"/>
    <line x1="16.5" y1="34" x2="31.5" y2="34" stroke="#4FC3DC" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="162" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="6" fill="#E8E6E3">HELIX</text>
  <text x="216" y="197" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="19" letter-spacing="7" fill="#8A8A99">C O R P O R A T I O N</text>

  <!-- tagline -->
  <text x="212" y="250" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="19" fill="#C1121F"># ninguna corporación es intocable<tspan fill="#E8E6E3">_</tspan></text>
</svg>
