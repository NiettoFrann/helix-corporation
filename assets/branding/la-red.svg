<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="La red de HELIX — cinco zonas">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <radialGradient id="rglow" cx="12%" cy="20%" r="80%">
      <stop offset="0" stop-color="#4FC3DC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4FC3DC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1000" height="200" rx="14" fill="url(#rbg)"/>
  <rect width="1000" height="200" rx="14" fill="url(#rgrid)"/>
  <rect width="1000" height="200" rx="14" fill="url(#rglow)"/>
  <rect x="1" y="1" width="998" height="198" rx="13" fill="none" stroke="#2A2A3A"/>

  <text x="54" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="2" fill="#E8E6E3">LA RED</text>
  <text x="56" y="122" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="16" fill="#8A8A99">red interna de HELIX Corp · 10.0.0.0/24 → 10.0.4.0/24</text>
  <text x="56" y="152" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#4FC3DC">// cinco zonas · cuanto más profundo, más cerca de Proyecto Cero<tspan fill="#E8E6E3">_</tspan></text>

  <!-- cadena de zonas 00 → 04 -->
  <g font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" text-anchor="middle">
    <g stroke="#2A2A3A" stroke-width="1.5">
      <line x1="636" y1="100" x2="684" y2="100"/>
      <line x1="716" y1="100" x2="764" y2="100"/>
      <line x1="796" y1="100" x2="844" y2="100"/>
      <line x1="876" y1="100" x2="924" y2="100" stroke="#740EE0" stroke-opacity="0.6" stroke-dasharray="4 4"/>
    </g>
    <circle cx="620" cy="100" r="16" fill="#0B0B0F" stroke="#4FC3DC" stroke-width="1.6"/><text x="620" y="105" fill="#4FC3DC">00</text>
    <circle cx="700" cy="100" r="16" fill="#0B0B0F" stroke="#3DF57E" stroke-width="1.6"/><text x="700" y="105" fill="#3DF57E">01</text>
    <circle cx="780" cy="100" r="16" fill="#0B0B0F" stroke="#E0A23C" stroke-width="1.6"/><text x="780" y="105" fill="#E0A23C">02</text>
    <circle cx="860" cy="100" r="16" fill="#0B0B0F" stroke="#C1121F" stroke-width="1.6"/><text x="860" y="105" fill="#C1121F">03</text>
    <circle cx="940" cy="100" r="16" fill="#0B0B0F" stroke="#740EE0" stroke-width="1.6" stroke-dasharray="4 4"/><text x="940" y="105" fill="#B37BF0">04</text>
  </g>
</svg>
