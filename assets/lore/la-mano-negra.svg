<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="La Mano Negra — ninguna corporación es intocable">
  <defs>
    <linearGradient id="lmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/><stop offset="1" stop-color="#160F11"/>
    </linearGradient>
    <radialGradient id="lmglow" cx="0%" cy="50%" r="80%">
      <stop offset="0" stop-color="#C1121F" stop-opacity="0.16"/><stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lmlacre" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#E0303C"/><stop offset="1" stop-color="#8A0C14"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="150" rx="14" fill="url(#lmbg)"/>
  <rect width="1000" height="150" rx="14" fill="url(#lmglow)"/>
  <rect x="1" y="1" width="998" height="148" rx="13" fill="none" stroke="#2A2A3A"/>
  <rect x="0" y="0" width="6" height="150" rx="3" fill="#C1121F"/>

  <text x="54" y="72" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="2" fill="#E8E6E3">LA MANO NEGRA</text>
  <text x="56" y="104" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#C1121F"># ninguna corporación es intocable<tspan fill="#E8E6E3">_</tspan></text>

  <!-- sello -->
  <g transform="translate(912 75)">
    <circle r="40" fill="none" stroke="#C1121F" stroke-width="1.8"/>
    <circle r="35" fill="url(#lmlacre)"/>
    <g stroke="#0B0B0F" stroke-width="4" stroke-linecap="round">
      <line x1="-12" y1="-14" x2="-17" y2="15"/>
      <line x1="1" y1="-17" x2="-4" y2="17"/>
      <line x1="15" y1="-14" x2="10" y2="15"/>
      <line x1="-20" y1="-3" x2="18" y2="-3"/>
      <line x1="-21" y1="7" x2="17" y2="7"/>
    </g>
  </g>
</svg>
