<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="HELIX Corporation — la empresa">
  <defs>
    <linearGradient id="lhbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/><stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <radialGradient id="lhglow" cx="0%" cy="50%" r="80%">
      <stop offset="0" stop-color="#4FC3DC" stop-opacity="0.13"/><stop offset="1" stop-color="#4FC3DC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="150" rx="14" fill="url(#lhbg)"/>
  <rect width="1000" height="150" rx="14" fill="url(#lhglow)"/>
  <rect x="1" y="1" width="998" height="148" rx="13" fill="none" stroke="#2A2A3A"/>
  <rect x="0" y="0" width="6" height="150" rx="3" fill="#4FC3DC"/>

  <text x="54" y="72" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="2" fill="#E8E6E3">HELIX CORPORATION</text>
  <text x="56" y="104" font-family="ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#4FC3DC">// la empresa, su gente y sus grietas<tspan fill="#E8E6E3">_</tspan></text>

  <!-- edificio corporativo -->
  <g transform="translate(884 40)" fill="none" stroke="#4FC3DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="6" width="40" height="64" rx="3"/>
    <rect x="40" y="22" width="32" height="48" rx="3"/>
    <g stroke-width="1.8">
      <line x1="9" y1="18" x2="17" y2="18"/><line x1="23" y1="18" x2="31" y2="18"/>
      <line x1="9" y1="32" x2="17" y2="32"/><line x1="23" y1="32" x2="31" y2="32"/>
      <line x1="9" y1="46" x2="17" y2="46"/><line x1="23" y1="46" x2="31" y2="46"/>
      <line x1="50" y1="34" x2="62" y2="34"/><line x1="50" y1="48" x2="62" y2="48"/>
    </g>
  </g>
</svg>
