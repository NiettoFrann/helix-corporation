# vsftpd — servidor de descargas público de HELIX (acceso anónimo, solo lectura).
listen=YES
listen_ipv6=NO

anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/ftp
anon_world_readable_only=YES

local_enable=NO
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES

# Chroot seguro para la sesión anónima.
secure_chroot_dir=/var/run/vsftpd/empty

# Modo pasivo acotado y anunciado como localhost (la máquina solo escucha ahí).
pasv_enable=YES
pasv_address=127.0.0.1
pasv_min_port=30000
pasv_max_port=30009

# En contenedor el sandbox de seccomp suele tumbar la sesión de datos.
seccomp_sandbox=NO
ftpd_banner=Servidor de descargas HELIX — uso interno. Material publico.
